apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-avaliacao
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-avaliacao
  template:
    metadata:
      labels:
        app: ms-avaliacao
    spec:
      containers:
        - name: ms-avaliacao
          image: ms-avaliacao:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-avaliacao
spec:
  type: NodePort
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
  selector:
    app: ms-avaliacao