apiVersion: apps/v1
kind: Deployment
metadata:
  name: sistema-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sistema-delivery
  template:
    metadata:
      labels:
        app: sistema-delivery
    spec:
      containers:
        - name: sistema-delivery
          image: sistema-delivery:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
---
apiVersion: v1
kind: Service
metadata:
  name: sistema-delivery
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: sistema-delivery